name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: 'true'
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -coverprofile=coverage.txt ./...

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: 'true'
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15

  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs:
      - test
      - lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          format: table
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          scan-type: fs
          vuln-type: 'os,library'


  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: local
            build_tags: ""
            env: ""
          - variant: gcloud
            build_tags: gcloud
            env: -e GCLOUD_PROJECT_ID=ci -e PUBSUB_EMULATOR_HOST=localhost:8085
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: primind_user
          POSTGRES_PASSWORD: primind_password
          POSTGRES_DB: primind_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U primind_user -d primind_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: time-mgmt:ci
          build-args: |
            BUILD_TAGS=${{ matrix.build_tags }}
          cache-from: type=gha,scope=${{ matrix.variant }}

      - name: Check grpc_health_probe
        run: docker run --rm --entrypoint /grpc_health_probe time-mgmt:ci -version

      - name: Start container and probe health
        run: |
          docker run -d --name app --network host \
            -e POSTGRES_DSN='postgres://primind_user:primind_password@localhost:5432/primind_db?sslmode=disable' \
            -e OTEL_EXPORTER_DISABLED=true \
            ${{ matrix.env }} \
            time-mgmt:ci
          for _ in $(seq 30); do
            if docker exec app /grpc_health_probe -addr=localhost:8080; then
              exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1
