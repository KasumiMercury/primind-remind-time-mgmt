version: "2"

linters:
    enable:
        - wsl_v5
        - bodyclose
        - contextcheck
        - fatcontext
        - containedctx
        - exhaustruct_v5
        - exhaustive
        - gosec
        - nilnil
        - nilerr
        - nlreturn
    settings:
        errcheck:
            check-type-assertions: true
            check-blank: true
            disable-default-exclusions: true
            exclude-functions:
                - fmt.Print
                - fmt.Printf
                - fmt.Println
        exhaustruct_v5:
            ignore-patterns:
                - 'log/slog\.HandlerOptions'
                - 'net/http\.Server'
                - 'gorm\.io/gorm\.Config'
                - '.*\.RemindModel'
                - 'google\.golang\.org/protobuf/encoding/protojson\.MarshalOptions'
                - 'google\.golang\.org/protobuf/encoding/protojson\.UnmarshalOptions'
                - 'github\.com/ThreeDotsLabs/watermill-nats/v2/pkg/nats\.PublisherConfig'
                - 'github\.com/ThreeDotsLabs/watermill-nats/v2/pkg/nats\.JetStreamConfig'
                - 'github\.com/nats-io/nats\.go/jetstream\.StreamConfig'
                - '.*health\.CheckResult'
        wsl_v5:
            allow-first-in-block: true
            allow-whole-block: false
            branch-max-lines: 2
    exclusions:
        rules:
            - path: _test\.go
              linters:
                  - errcheck
                  - exhaustruct_v5
                  - gosec
                  - staticcheck
                  - fatcontext
                  - containedctx
